<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ agent_name }} — Climate Intelligence System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1923;
            color: #e0e0e0;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #1a2a3a 0%, #0d1b2a 100%);
            border-bottom: 1px solid #1e3a5f;
            padding: 1.5rem 2rem;
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-icon {
            font-size: 1.6rem;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }

        header h1 {
            font-size: 1.4rem;
            color: #ffffff;
        }

        header p {
            color: #7ea8c9;
            font-size: 0.85rem;
        }

        .back-link {
            color: #7ea8c9;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            border: 1px solid #1e3a5f;
            border-radius: 6px;
            transition: background 0.15s;
        }

        .back-link:hover { background: #1e3a5f; }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        #status {
            text-align: center;
            padding: 3rem;
            font-size: 1.1rem;
            color: #7ea8c9;
        }

        .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #1e3a5f;
            border-top-color: {{ agent_color }};
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #output {
            display: none;
            background: #172a3a;
            border: 1px solid #1e3a5f;
            border-radius: 10px;
            padding: 1.5rem;
            white-space: pre-wrap;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            overflow-x: auto;
            max-height: 75vh;
            overflow-y: auto;
        }

        .actions {
            margin-top: 1.2rem;
            display: none;
            gap: 0.75rem;
        }

        .btn {
            display: inline-block;
            padding: 0.55rem 1.1rem;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.15s;
        }

        .btn:hover { opacity: 0.85; }

        .btn-rerun { background: {{ agent_color }}; }
        .btn-back { background: #34495e; }

        .elapsed {
            color: #4a6a7a;
            font-size: 0.82rem;
            margin-top: 0.6rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #4a6a7a;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="header-left">
                <div class="header-icon" style="background: {{ agent_color }}22;">{{ agent_icon }}</div>
                <div>
                    <h1>{{ agent_name }}</h1>
                    <p>{{ agent_description }}</p>
                </div>
            </div>
            <a href="/" class="back-link">Dashboard</a>
        </div>
    </header>

    <div class="container">
        <div id="status">
            <div class="spinner"></div>
            <div>Running {{ agent_name }}...</div>
            <div style="font-size: 0.85rem; margin-top: 0.4rem;">Fetching live data from APIs</div>
        </div>

        <pre id="output"></pre>

        <div class="actions" id="actions">
            <button class="btn btn-rerun" onclick="runAgent()">Re-run Agent</button>
            <a href="/" class="btn btn-back">Back to Dashboard</a>
        </div>
        <div class="elapsed" id="elapsed"></div>
    </div>

    <footer>Climate Intelligence System</footer>

    <script>
        function runAgent() {
            var status = document.getElementById('status');
            var output = document.getElementById('output');
            var actions = document.getElementById('actions');
            var elapsed = document.getElementById('elapsed');

            status.style.display = 'block';
            output.style.display = 'none';
            actions.style.display = 'none';
            elapsed.textContent = '';

            var start = Date.now();

            fetch('/api/run/{{ agent_key }}')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    var seconds = ((Date.now() - start) / 1000).toFixed(1);
                    status.style.display = 'none';
                    output.style.display = 'block';
                    output.textContent = data.output;
                    actions.style.display = 'flex';
                    elapsed.textContent = 'Completed in ' + seconds + 's';
                })
                .catch(function(err) {
                    status.style.display = 'none';
                    output.style.display = 'block';
                    output.textContent = 'Error: ' + err.message;
                    actions.style.display = 'flex';
                });
        }

        runAgent();
    </script>
</body>
</html>
